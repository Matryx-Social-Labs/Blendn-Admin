# Nixpacks configuration for Railway deployment
# Explicitly define build and start to use custom server with Socket.io

[phases.setup]
nixPkgs = ["nodejs_20", "npm-9_x"]

[phases.install]
cmds = ["npm install --legacy-peer-deps"]
cacheDirectories = []

[phases.build]
cmds = [
  "npx prisma generate",
  "npm run build"
]
cacheDirectories = [".next/cache"]

[start]
cmd = "echo '=== Starting server ===' && ls -la dist/ && ls -la .next/ && node dist/server.js"
