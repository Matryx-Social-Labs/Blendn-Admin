# NOTE: Railway builds this service with railpack, not nixpacks — verified in
# the build logs. This file is retained only so a future switch back to the
# nixpacks builder does not silently lose the custom start command, which must
# run server.ts (Socket.io) rather than `next start`.
#
# If you change build behaviour, change it in railway.json. Editing this file
# alone will have no effect.

[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm run start"
