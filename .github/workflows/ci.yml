name: CI

on:
  pull_request:
    branches: [dev, stage, prod]
  push:
    branches: [dev, stage, prod]

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/blendn_test
  NEXTAUTH_URL: http://localhost:3000
  NEXTAUTH_SECRET: ci-test-secret-please-change-32-characters
  MOBILE_JWT_SECRET: ci-test-jwt-secret-please-change-32-chars

jobs:
  lint-test-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: blendn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # Deliberately NOT --legacy-peer-deps. Railway builds with a strict
      # install, so the flag made CI pass while the deploy failed on an
      # unresolvable peer range — which is exactly what happened on the zod 4
      # upgrade. CI has to reproduce the deploy's install or it is not a gate.
      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Push database schema
        run: npm run db:push

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.json

      - name: Test
        run: npm test -- --ci

      # Runs against the postgres service above, which already has the schema
      # pushed. The unit suite mocks @/lib/db everywhere, so without this a
      # Prisma upgrade could break every query and CI would stay green.
      - name: Integration tests
        run: npm run test:integration -- --ci

      - name: Build
        run: npm run build
